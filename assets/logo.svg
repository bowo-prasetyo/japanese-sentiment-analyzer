<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 64" role="img" aria-labelledby="t">
  <title id="t">Tenbin（天秤）</title>
  <!-- 文字はシステムフォントで描画（アウトライン化していない） -->
  <!-- 天秤の支柱・竿・吊りひも（竿は水平＝公平に量る） -->
  <g fill="#263238">
    <circle cx="32" cy="9" r="4"/>
    <rect x="29.5" y="11" width="5" height="42" rx="2"/>
    <rect x="18" y="52" width="28" height="6" rx="3"/>
    <rect x="5" y="14" width="54" height="5" rx="2.5"/>
  </g>
  <g fill="none" stroke="#263238" stroke-width="2" stroke-linecap="round">
    <path d="M4 32 L11 17 L18 32"/>
    <path d="M46 32 L53 17 L60 32"/>
  </g>
  <!-- 皿＝吹き出し（左: ポジティブ、右: ネガティブ）。しっぽは外側の下 -->
  <path fill="#2e7d32" d="M5 31 H17 a4 4 0 0 1 4 4 v5 a4 4 0 0 1 -4 4 H8 L3 49 L4 43.6 a4 4 0 0 1 -3 -3.6 v-5 a4 4 0 0 1 4 -4 Z"/>
  <path fill="#c62828" d="M59 31 H47 a4 4 0 0 0 -4 4 v5 a4 4 0 0 0 4 4 H56 L61 49 L60 43.6 a4 4 0 0 0 3 -3.6 v-5 a4 4 0 0 0 -4 -4 Z"/>
  <text x="76" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="0.5" fill="#263238">Tenbin</text>
  <text x="196" y="44" font-family="'Hiragino Sans', 'Yu Gothic', 'Noto Sans JP', 'Meiryo', sans-serif" font-size="20" fill="#607d8b">天秤</text>
</svg>
