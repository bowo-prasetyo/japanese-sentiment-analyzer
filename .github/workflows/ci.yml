name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unit tests
        run: npm test

      - name: Accuracy check (macro-F1 must not drop below baseline)
        run: npm run eval -- --check

      - name: Verify pinned CDN scripts (version + SRI)
        run: npm run check:cdn

      - name: Blind benchmark (report only, never fails on score)
        run: npm run bench -- --summary
